<!DOCTYPE html>

<head>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Space+Mono&family=Syne:wght@700;800&display=swap');

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background: #000;
            color: #f5f5f7;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            line-height: 1.5;
        }

        ::selection { background: #fff; color: #000; }
        img, video, svg { display: block; max-width: 100%; -webkit-user-drag: none; user-drag: none; }
        a, button, select { pointer-events: auto; color: inherit; text-decoration: none; font: inherit; cursor: pointer; background: none; border: none; }

        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 50;
            background: rgba(29, 29, 31, 0.72);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-bar {
            max-width: 80rem; margin: 0 auto; padding: 0 1.5rem; height: 3rem;
            display: flex; align-items: center; justify-content: space-between; font-size: 0.75rem;
        }

        .nav-left { display: flex; align-items: center; gap: 1rem; }
        .brand-link { display: flex; align-items: center; transition: opacity 0.2s; }
        .brand-link:hover { opacity: 0.8; }
        .brand-link img { height: 2rem; width: auto; object-fit: contain; }
        .divider { color: rgba(255, 255, 255, 0.3); font-weight: 300; margin-left: 0.25rem; }

        nav { display: flex; align-items: center; gap: 1rem; color: rgba(255, 255, 255, 0.6); }
        nav a { transition: color 0.2s; }
        nav a:hover, nav a.active { color: #fff; }

        .nav-right { display: flex; align-items: center; gap: 1.5rem; }
        .clock-display { display: none; align-items: center; gap: 0.75rem; font-size: 10px; font-family: 'Space Mono', monospace; color: rgba(255, 255, 255, 0.5); letter-spacing: 0.1em; text-transform: uppercase; }
        .clock-divider { color: rgba(255, 255, 255, 0.2); }

        .social-links { display: flex; align-items: center; gap: 1.25rem; color: rgba(255, 255, 255, 0.6); }
        .social-links a { transition: color 0.2s; }
        .social-links a:hover { color: #fff; }
        .social-links svg { width: 1rem; height: 1rem; fill: currentColor; }

        #stage {
            position: absolute; inset: 0; width: 100vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }

        #lead-reel {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1; pointer-events: none;
        }

        #scrim {
            position: absolute; inset: 0; background: rgba(0, 0, 0, 0.35);
            z-index: 2; pointer-events: none;
        }

        #marquee {
            position: relative; z-index: 3; text-align: center; pointer-events: none;
            padding: 0 1rem; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%;
        }

        .tagline { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.25em; color: #0098d4; font-weight: 600; margin-bottom: 1.25rem; }
        .hero-logo { width: 75vw; height: auto; object-fit: contain; margin-bottom: 2rem; filter: drop-shadow(0 25px 25px rgba(0, 0, 0, 0.15)); }

        .hero-btn {
            position: relative; display: inline-flex; align-items: center; justify-content: center;
            padding: 0.75rem 2rem; margin-top: 1rem; font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700;
            letter-spacing: 0.2em; text-transform: uppercase; color: #fff; overflow: hidden; border-radius: 0.375rem;
            border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: border-color 0.3s; pointer-events: auto;
        }
        .hero-btn:hover { border-color: rgba(0, 152, 212, 0.6); }
        .hero-btn-fill { position: absolute; inset: 0; background: rgba(0, 152, 212, 0.2); transform: scaleX(0); transform-origin: left; transition: transform 0.3s; }
        .hero-btn:hover .hero-btn-fill { transform: scaleX(1); }
        .hero-btn-text { position: relative; z-index: 10; }

        footer { position: fixed; bottom: 0; left: 0; width: 100%; z-index: 50; background: transparent; }
        .footer-bar { max-width: 80rem; margin: 0 auto; padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: rgba(255, 255, 255, 0.5); }
        
        .lang-select { position: relative; pointer-events: auto; }
        .lang-select select { appearance: none; color: rgba(255, 255, 255, 0.5); padding-right: 1.25rem; outline: none; transition: color 0.2s; }
        .lang-select select:hover { color: #fff; }
        .lang-select option { background: #111113; color: #fff; }
        .select-arrow { pointer-events: none; position: absolute; top: 0; bottom: 0; right: 0; display: flex; align-items: center; padding: 0 0.25rem; color: rgba(255, 255, 255, 0.5); }
        .select-arrow svg { width: 0.75rem; height: 0.75rem; fill: currentColor; }

        @media (min-width: 640px) { .clock-display { display: flex; } .tagline { font-size: 0.875rem; } }
        @media (min-width: 768px) { .hero-logo { width: 45vw; } }
    </style>
</head>

    <script>
        function updateClocks() {
            const localEl = document.getElementById('local-time');
            const utcEl = document.getElementById('utc-time');
            if (!localEl || !utcEl) return;
            function tick() {
                const now = new Date();
                localEl.textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')} LOC`;
                utcEl.textContent = `${String(now.getUTCHours()).padStart(2, '0')}:${String(now.getUTCMinutes()).padStart(2, '0')}:${String(now.getUTCSeconds()).padStart(2, '0')} UTC`;
            }
            tick(); setInterval(tick, 1000);
        }

        function disableShortcuts() {
            window.oncontextmenu = () => false;
            window.ondragstart = () => false;
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateClocks();
            disableShortcuts();
        });

        const dictionary = {
            en: {
                nav_photo: "photography", nav_video: "videography", nav_about: "about",
                hero_tagline: "Welcome Onboard", hero_btn: "about me", footer_copy: "copyright © 2026 peachworks. all rights reserved."
            },
            de: {
                nav_photo: "fotografie", nav_video: "videografie", nav_about: "über mich",
                hero_tagline: "Willkommen an Bord", hero_btn: "über mich", footer_copy: "copyright © 2026 peachworks. alle rechte vorbehalten."
            },
            es: {
                nav_photo: "fotografía", nav_video: "videografía", nav_about: "sobre mí",
                hero_tagline: "Bienvenido a bordo", hero_btn: "sobre mí", footer_copy: "copyright © 2026 peachworks. todos los derechos reservados."
            }
        };

        const langSelect = document.querySelector('.lang-select select');
        function setLanguage(lang) {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dictionary[lang] && dictionary[lang][key]) el.innerHTML = dictionary[lang][key];
            });
            localStorage.setItem('peachLang', lang);
            if(langSelect) langSelect.value = lang;
        }
        if(langSelect) langSelect.addEventListener('change', (e) => setLanguage(e.target.value));
        setLanguage(localStorage.getItem('peachLang') || 'en');
    </script>
