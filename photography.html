<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography — peachwerke</title>
    <link rel="icon" type="image/png" href="media/pictures/favicon.png">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Space+Mono&family=Syne:wght@700;800&display=swap');

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        html { scroll-behavior: smooth; }
        body { background: #000; color: #f5f5f7; font-family: 'Outfit', sans-serif; overflow-x: hidden; line-height: 1.5; }
        ::selection { background: #fff; color: #000; }
        img, video, svg { display: block; max-width: 100%; user-drag: none; }
        a, button, select { pointer-events: auto; color: inherit; text-decoration: none; font: inherit; cursor: pointer; background: none; border: none; }

        header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 60;
            background: rgba(29, 29, 31, 0.72); backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-bar { max-width: 80rem; margin: 0 auto; padding: 0 1.5rem; height: 3rem; display: flex; align-items: center; justify-content: space-between; font-size: 0.75rem; }
        .nav-left { display: flex; align-items: center; gap: 1rem; }
        .brand-link { display: flex; align-items: center; transition: opacity 0.2s; }
        .brand-link:hover { opacity: 0.8; }
        .brand-link img { height: 2rem; width: auto; object-fit: contain; }
        .divider { color: rgba(255, 255, 255, 0.3); font-weight: 300; margin-left: 0.25rem; }
        nav { display: flex; align-items: center; gap: 1rem; color: rgba(255, 255, 255, 0.6); }
        nav a { transition: color 0.2s; }
        nav a:hover, nav a.active { color: #fff; }

        .nav-right { display: flex; align-items: center; gap: 1.5rem; }
        .clock-display { display: none; align-items: center; gap: 0.75rem; font-size: 10px; font-family: 'Space Mono', monospace; color: rgba(255, 255, 255, 0.5); letter-spacing: 0.1em; text-transform: uppercase; }
        .clock-divider { color: rgba(255, 255, 255, 0.2); }

        .social-links { display: flex; align-items: center; gap: 1.25rem; color: rgba(255, 255, 255, 0.6); }
        .social-links a { transition: color 0.2s; }
        .social-links a:hover { color: #fff; }
        .social-links svg { width: 1rem; height: 1rem; fill: currentColor; }

        .fixed-bottom-scrim { position: fixed; bottom: 0; left: 0; right: 0; height: 30vh; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%); z-index: 30; pointer-events: none; }

        .gallery-header { position: fixed; top: 6rem; left: 1.5rem; z-index: 40; pointer-events: none; }
        .section-label { font-size: 0.75rem; font-family: 'Space Mono', monospace; color: #0098d4; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.25rem; }
        .section-title { font-size: 1.5rem; line-height: 1; font-weight: 800; letter-spacing: -0.025em; color: #fff; font-family: 'Syne', sans-serif; margin-bottom: 0.25rem; }
        .section-desc { color: rgba(255, 255, 255, 0.6); font-size: 0.75rem; font-family: 'Space Mono', monospace; }

        .scroll-prompt { position: fixed; bottom: 4.5rem; right: 1.5rem; z-index: 40; display: flex; align-items: center; gap: 0.5rem; font-family: 'Space Mono', monospace; font-size: 0.75rem; text-transform: uppercase; color: rgba(255, 255, 255, 0.8); transition: color 0.2s; pointer-events: auto; }
        .scroll-prompt:hover { color: #fff; }
        .scroll-prompt svg { width: 1.25rem; height: 1.25rem; fill: currentColor; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(5px); } 60% { transform: translateY(3px); } }

        footer { position: fixed; bottom: 0; left: 0; width: 100%; z-index: 50; pointer-events: none; }
        .footer-bar { padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: rgba(255, 255, 255, 0.5); pointer-events: auto; }
        .lang-select { position: relative; }
        .lang-select select { appearance: none; background: transparent; border: none; color: rgba(255, 255, 255, 0.5); padding-right: 1.25rem; outline: none; transition: color 0.2s; cursor: pointer; }
        .lang-select select:hover { color: #fff; }
        .lang-select option { background: #111113; color: #fff; }
        .select-arrow { pointer-events: none; position: absolute; top: 0; bottom: 0; right: 0; display: flex; align-items: center; padding: 0 0.25rem; color: rgba(255, 255, 255, 0.5); }
        .select-arrow svg { width: 0.75rem; height: 0.75rem; fill: currentColor; }

        /* SCROLLING MEDIA WALL */
        .collage-section { background: #000; width: 100vw; min-height: 100vh; padding-bottom: 6rem; }
        
        .hero-item { width: 100vw; height: calc(100vh - 18.75vw); min-height: 50vh; position: relative; background: #000; overflow: hidden; cursor: pointer; }
        .hero-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94); pointer-events: none; }
        .hero-item:hover img { transform: scale(1.03); }
        
        .collage-grid { display: grid; width: 100%; gap: 0; scroll-margin-top: 3rem; }
        .media-item { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #000; cursor: pointer; }
        .media-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94); pointer-events: none; }
        .media-item:hover img { transform: scale(1.03); }
        
        .media-info { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0, 0, 0, 0.8) 0%, rgba(0, 0, 0, 0.2) 40%, rgba(0, 0, 0, 0.2) 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.4s ease; pointer-events: none; padding: 2.5rem; text-align: center; z-index: 10; }
        .hero-item .media-info { justify-content: center; }
        .hero-item:hover .media-info, .media-item:hover .media-info { opacity: 1; }
        .item-text-wrap { transform: translateY(15px); transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        .hero-item:hover .item-text-wrap, .media-item:hover .item-text-wrap { transform: translateY(0); }
        .item-title { font-size: 1.25rem; font-weight: 700; color: #fff; font-family: 'Syne', sans-serif; }

        @media (max-width: 767px) {
            .collage-grid { grid-template-columns: 1fr; }
            .hero-item { height: 65vh; }
        }
        @media (min-width: 768px) { 
            .clock-display { display: flex; } 
            .collage-grid { grid-template-columns: repeat(3, 1fr); } 
            .gallery-header { bottom: 4rem; left: 3rem; }
            .scroll-prompt { bottom: 4.5rem; right: 3rem; }
            .hero-item .item-title { font-size: 3.5rem; }
        }
    </style>

    <script>
        function updateClocks() {
            const localEl = document.getElementById('local-time'), utcEl = document.getElementById('utc-time');
            if (!localEl || !utcEl) return;
            function tick() {
                const now = new Date();
                localEl.textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')} LOC`;
                utcEl.textContent = `${String(now.getUTCHours()).padStart(2, '0')}:${String(now.getUTCMinutes()).padStart(2, '0')}:${String(now.getUTCSeconds()).padStart(2, '0')} UTC`;
            }
            tick(); setInterval(tick, 1000);
        }
        document.addEventListener('DOMContentLoaded', updateClocks);

        const dictionary = {
            en: { nav_photo: "photography", nav_video: "videography", nav_about: "about", sec_label: "Dossier", sec_photo_desc: "Selection of various stills", view_more: "view more", footer_copy: "copyright © 2026 peachworks. all rights reserved." },
            de: { nav_photo: "fotografie", nav_video: "videografie", nav_about: "über mich", sec_label: "Akte", sec_photo_desc: "Auswahl verschiedener Aufnahmen", view_more: "mehr ansehen", footer_copy: "copyright © 2026 peachworks. alle rechte vorbehalten." },
            es: { nav_photo: "fotografía", nav_video: "videografía", nav_about: "sobre mí", sec_label: "Dosier", sec_photo_desc: "Selección de varias imágenes", view_more: "ver más", footer_copy: "copyright © 2026 peachworks. todos los derechos reservados." }
        };

        const langSelect = document.querySelector('.lang-select select');
        function setLanguage(lang) {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dictionary[lang] && dictionary[lang][key]) el.innerHTML = dictionary[lang][key];
            });
            localStorage.setItem('peachLang', lang);
            if(langSelect) langSelect.value = lang;
        }
        if(langSelect) langSelect.addEventListener('change', (e) => setLanguage(e.target.value));
        setLanguage(localStorage.getItem('peachLang') || 'en');
    </script>
